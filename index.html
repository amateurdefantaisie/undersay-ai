<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undersay AI - Amateur De Fantaisie</title>
    <style>
        :root { --primary: #00ffcc; --bg: #0f172a; --chat-bg: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 500px; height: 80vh; background: var(--chat-bg); border-radius: 15px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; overflow: hidden; }
        .header { background: #1e293b; padding: 20px; border-bottom: 1px solid #334155; text-align: center; }
        .header h2 { margin: 0; font-size: 1.2rem; color: var(--primary); letter-spacing: 1px; }
        #chatbox { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 80%; line-height: 1.4; font-size: 0.95rem; }
        .user { align-self: flex-end; background: var(--primary); color: #000; font-weight: 500; }
        .ai { align-self: flex-start; background: #334155; color: #fff; border: 1px solid #475569; }
        .input-area { padding: 20px; display: flex; gap: 10px; background: #1e293b; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        input:focus { border-color: var(--primary); }
        button { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header"><h2>UNDERSAY AI</h2></div>
    <div id="chatbox">
        <div class="msg ai">Salutations ! Je suis Undersay. Comment puis-je assister votre quête numérique aujourd'hui ?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Écrivez votre message...">
        <button onclick="sendMessage()">Envoyer</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chatbox');
        const text = input.value.trim();
        
        if (!text) return;

        // Afficher message utilisateur
        box.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';
        box.scrollTop = box.scrollHeight;

        try {
            // Utilisation d'une URL relative pour Codespaces
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text: text})
            });
            const data = await res.json();
            
            // Afficher réponse IA
            box.innerHTML += `<div class="msg ai">${data.reply}</div>`;
        } catch (e) {
            box.innerHTML += `<div class="msg ai" style="color: #ff4444;">Erreur: Impossible de joindre Undersay. Vérifiez que le serveur tourne.</div>`;
        }
        box.scrollTop = box.scrollHeight;
    }

    // Permettre d'envoyer avec la touche Entrée
    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
